# 공통 테마 (A 소유, TEAM_CONTRACT §2). secrets.toml은 이 폴더에 두더라도 커밋 금지.
[theme]
primaryColor = "#1F6FB2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#1E293B"
font = "sans serif"

[server]
# 업로드 제한 10MB (TEAM_CONTRACT §3.1). 실제 크기 검사는 save_case에서 다시 한다.
maxUploadSize = 10
